<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadaroma Candle Catalogue</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ffb6c1, #ff69b4);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 0 20px;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1rem;
      max-width: 450px;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .btn {
      background-color: #fff;
      color: #ff69b4;
      padding: 14px 36px;
      border: none;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
    }

    .btn:hover {
      background-color: #ffe4ec;
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 105, 180, 0.4);
    }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <h1>🕯️ Cadaroma Candles</h1>
  <p>Illuminate Every Moment with Cadaroma Candles.<br>
     Discover our range of handmade gifting candles crafted with love and elegance.</p>

  <footer>© 2025 Cadaroma Candles</footer>
</body>
</html>
